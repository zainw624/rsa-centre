kind = "web"
previewPath = "/"
title = "RSA Operations Centre"
version = "1.0.0"
id = "artifacts/rsa-ops"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26138

[services.development]
run = "pnpm --filter @workspace/rsa-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rsa-ops", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rsa-ops", "run", "start" ]

[services.env]
PORT = "26138"
